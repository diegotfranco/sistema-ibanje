# If an upstream proxy (e.g. cloudflared) already set X-Forwarded-Proto, keep it;
# otherwise fall back to the scheme of the request to nginx.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reasonable upload ceiling (must allow API receipt uploads — 5MB plus headroom)
  client_max_body_size 10M;

  # --- Security headers (defense-in-depth) ---------------------------------
  # `always` so they're emitted on error responses too. The SPA + API share this
  # origin (API is proxied under /api/), so default-src 'self' covers XHR/fetch.
  #
  # 'unsafe-inline' on style-src: Tailwind v4 and Radix inject runtime inline styles
  # (CSS custom properties, transform positioning) — a strict style nonce isn't
  # feasible with the current build, and styles can't exfiltrate data. Scripts get NO
  # such escape hatch: script-src stays 'self' only, which is what actually blocks XSS.
  # img-src allows data: for inline SVG/icon data-URIs; connect-src 'self' keeps fetch
  # same-origin. No framing (frame-ancestors 'none' == X-Frame-Options DENY superset).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml font/woff2 image/svg+xml;
  gzip_min_length 1024;

  # Long-cache hashed assets. NOTE: defining add_header here drops the server-level
  # security headers (nginx replaces, not merges), so nosniff is re-stated.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # API proxy — strip /api/ prefix to match the Vite dev proxy semantics.
  # The trailing slash on both location and proxy_pass is critical: it removes /api/.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;
  }

  # SPA fallback: serve index.html for client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the entry HTML — must always pull fresh to get new asset hashes.
  # The SPA fallback internally rewrites to /index.html, re-matching this exact
  # location; because it defines add_header, the server-level security headers are
  # NOT inherited, so the full set is re-stated here (this is the document response
  # where CSP matters most).
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
